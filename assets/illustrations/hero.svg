<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <linearGradient id="hero-blob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="hero-blob-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop blob -->
  <path d="M 90 210 C 60 100 200 40 320 55 C 460 72 560 130 570 250 C 580 375 500 470 370 500 C 230 532 90 480 60 370 C 38 290 110 260 90 210 Z" fill="url(#hero-blob-soft)"/>

  <!-- main gradient blob -->
  <path d="M 130 230 C 115 130 240 85 340 100 C 450 117 530 175 528 270 C 526 372 450 445 340 462 C 225 480 130 425 108 335 C 92 270 142 285 130 230 Z" fill="url(#hero-blob)"/>
  <path d="M 130 230 C 115 130 240 85 340 100 C 450 117 530 175 528 270 C 526 372 450 445 340 462 C 225 480 130 425 108 335 C 92 270 142 285 130 230 Z" fill="url(#hero-glow)"/>

  <!-- orbiting care ring -->
  <ellipse cx="330" cy="270" rx="230" ry="230" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 10"/>

  <!-- connection nodes: guide + two family dots -->
  <line x1="330" y1="270" x2="228" y2="185" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="330" y1="270" x2="410" y2="180" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="330" y1="270" x2="405" y2="355" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="228" cy="185" r="10" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="410" cy="180" r="7" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="405" cy="355" r="7" fill="#ffffff" fill-opacity="0.75"/>

  <!-- center medallion with leaf mark, echoing the logo -->
  <circle cx="330" cy="270" r="68" fill="url(#hero-leaf)"/>
  <circle cx="330" cy="270" r="68" fill="none" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="10"/>
  <path d="M 330 232 C 356 236 372 258 368 284 C 344 288 320 276 316 250 C 314 240 320 234 330 232 Z" fill="none" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 330 232 C 315 260 315 292 330 308" fill="none" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round"/>

  <!-- small data cards floating -->
  <g transform="translate(70 120)">
    <rect x="0" y="0" width="86" height="58" rx="12" fill="#ffffff"/>
    <rect x="14" y="16" width="46" height="7" rx="3.5" fill="#c4b5fd"/>
    <rect x="14" y="32" width="30" height="7" rx="3.5" fill="#e9d5ff"/>
  </g>
  <g transform="translate(478 355)">
    <rect x="0" y="0" width="96" height="66" rx="14" fill="#ffffff"/>
    <circle cx="24" cy="24" r="10" fill="#ddd6fe"/>
    <rect x="44" y="18" width="40" height="6" rx="3" fill="#c4b5fd"/>
    <rect x="44" y="32" width="26" height="6" rx="3" fill="#e9d5ff"/>
    <rect x="14" y="46" width="70" height="6" rx="3" fill="#f3e8ff"/>
  </g>

  <!-- scattered dots -->
  <circle cx="150" cy="420" r="5" fill="#7c3aed" fill-opacity="0.5"/>
  <circle cx="500" cy="140" r="4" fill="#c026d3" fill-opacity="0.5"/>
  <circle cx="560" cy="260" r="6" fill="#a78bfa" fill-opacity="0.5"/>
</svg>
